services:
  mysql:
    image: mysql:8.4
    container_name: stocksense-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stocksense
      MYSQL_USER: stocksense
      MYSQL_PASSWORD: stocksense
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - stocksense-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  stocksense-mysql-data: